name: 'Cloudwright PR Comment'
description: 'Post arch diff, cost delta, and compliance changes as an idempotent PR comment when spec.yaml or .tf files change'
author: 'Cloudwright'
branding:
  icon: 'cloud'
  color: 'blue'

inputs:
  spec-path:
    description: 'Path to the ArchSpec YAML (e.g. cloudwright.yaml or spec.yaml)'
    required: true
  compliance:
    description: 'Comma-separated compliance frameworks (e.g. hipaa,soc2,pci-dss)'
    required: false
    default: ''
  workload-profile:
    description: 'Workload sizing profile (small, medium, large, enterprise)'
    required: false
    default: ''
  base-ref:
    description: 'Base ref for diff (defaults to PR base sha)'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for posting the comment'
    required: false
    default: ${{ github.token }}
  marker:
    description: 'HTML comment marker used to find and update an existing comment'
    required: false
    default: '<!-- cloudwright-pr-comment -->'
  python-version:
    description: 'Python version for the action runtime'
    required: false
    default: '3.12'

outputs:
  comment-body:
    description: 'The rendered Markdown comment body'
    value: ${{ steps.render.outputs.comment_body_path }}
  cost-delta-monthly:
    description: 'Computed monthly cost delta in USD (head - base)'
    value: ${{ steps.render.outputs.cost_delta_monthly }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Cloudwright
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install 'cloudwright-ai[cli]'

    - name: Resolve base ref
      id: base
      shell: bash
      env:
        BASE_REF_INPUT: ${{ inputs.base-ref }}
      run: |
        if [ -n "$BASE_REF_INPUT" ]; then
          echo "ref=$BASE_REF_INPUT" >> "$GITHUB_OUTPUT"
        elif [ -n "${{ github.event.pull_request.base.sha }}" ]; then
          echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
        fi

    - name: Materialize base spec
      id: base-spec
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
        BASE_REF: ${{ steps.base.outputs.ref }}
      run: |
        mkdir -p /tmp/cloudwright-pr
        if git show "$BASE_REF:$SPEC_PATH" > /tmp/cloudwright-pr/base-spec.yaml 2>/dev/null; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          rm -f /tmp/cloudwright-pr/base-spec.yaml
        fi

    - name: Run cloudwright on head spec
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
        COMPLIANCE: ${{ inputs.compliance }}
        WORKLOAD_PROFILE: ${{ inputs.workload-profile }}
      run: |
        set -e
        if [ ! -f "$SPEC_PATH" ]; then
          echo "Head spec not found at $SPEC_PATH — skipping"
          echo '{}' > /tmp/cloudwright-pr/head-cost.json
          echo '{}' > /tmp/cloudwright-pr/head-validate.json
          exit 0
        fi
        COST_ARGS=()
        if [ -n "$WORKLOAD_PROFILE" ]; then
          COST_ARGS+=("--workload-profile" "$WORKLOAD_PROFILE")
        fi
        cloudwright --json cost "$SPEC_PATH" "${COST_ARGS[@]}" > /tmp/cloudwright-pr/head-cost.json 2>/tmp/cloudwright-pr/head-cost.err || cat /tmp/cloudwright-pr/head-cost.err
        VALIDATE_ARGS=()
        if [ -n "$COMPLIANCE" ]; then
          VALIDATE_ARGS+=("--compliance" "$COMPLIANCE")
        fi
        cloudwright --json validate "$SPEC_PATH" "${VALIDATE_ARGS[@]}" > /tmp/cloudwright-pr/head-validate.json 2>/tmp/cloudwright-pr/head-validate.err || cat /tmp/cloudwright-pr/head-validate.err

    - name: Run cloudwright on base spec
      if: steps.base-spec.outputs.exists == 'true'
      shell: bash
      env:
        COMPLIANCE: ${{ inputs.compliance }}
        WORKLOAD_PROFILE: ${{ inputs.workload-profile }}
      run: |
        set -e
        COST_ARGS=()
        if [ -n "$WORKLOAD_PROFILE" ]; then
          COST_ARGS+=("--workload-profile" "$WORKLOAD_PROFILE")
        fi
        cloudwright --json cost /tmp/cloudwright-pr/base-spec.yaml "${COST_ARGS[@]}" > /tmp/cloudwright-pr/base-cost.json 2>/tmp/cloudwright-pr/base-cost.err || cat /tmp/cloudwright-pr/base-cost.err
        VALIDATE_ARGS=()
        if [ -n "$COMPLIANCE" ]; then
          VALIDATE_ARGS+=("--compliance" "$COMPLIANCE")
        fi
        cloudwright --json validate /tmp/cloudwright-pr/base-spec.yaml "${VALIDATE_ARGS[@]}" > /tmp/cloudwright-pr/base-validate.json 2>/tmp/cloudwright-pr/base-validate.err || cat /tmp/cloudwright-pr/base-validate.err

    - name: Render Markdown comment
      id: render
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
        MARKER: ${{ inputs.marker }}
        COMPLIANCE: ${{ inputs.compliance }}
        WORKLOAD_PROFILE: ${{ inputs.workload-profile }}
        BASE_EXISTS: ${{ steps.base-spec.outputs.exists }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ steps.base.outputs.ref }}
      run: |
        python ${{ github.action_path }}/render_comment.py \
          --head-cost /tmp/cloudwright-pr/head-cost.json \
          --head-validate /tmp/cloudwright-pr/head-validate.json \
          --base-cost /tmp/cloudwright-pr/base-cost.json \
          --base-validate /tmp/cloudwright-pr/base-validate.json \
          --base-spec /tmp/cloudwright-pr/base-spec.yaml \
          --head-spec "$SPEC_PATH" \
          --marker "$MARKER" \
          --compliance "$COMPLIANCE" \
          --workload-profile "$WORKLOAD_PROFILE" \
          --output /tmp/cloudwright-pr/comment.md
        echo "comment_body_path=/tmp/cloudwright-pr/comment.md" >> "$GITHUB_OUTPUT"
        DELTA=$(python -c "import json; d=json.load(open('/tmp/cloudwright-pr/cost-delta.json')); print(d.get('monthly_delta', 0))" 2>/dev/null || echo "0")
        echo "cost_delta_monthly=$DELTA" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        MARKER: ${{ inputs.marker }}
        COMMENT_FILE: ${{ steps.render.outputs.comment_body_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = process.env.MARKER;
          const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            core.info(`Updated existing comment ${existing.id}`);
          } else {
            const { data: created } = await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
            core.info(`Created new comment ${created.id}`);
          }
