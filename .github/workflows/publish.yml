name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install hatchling build

      - name: Build core
        run: python -m build packages/core
      - name: Build CLI
        run: python -m build packages/cli
      - name: Build web
        run: python -m build packages/web
      - name: Build MCP
        run: python -m build packages/mcp

      - name: Publish core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/core/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish CLI to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cli/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish web to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/web/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish MCP to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/mcp/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
