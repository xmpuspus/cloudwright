id: aws-three-tier-web
name: AWS Three-Tier Web
provider: aws
category: web
description: Approved web baseline with CDN, load balancer, compute, and relational data tier.
approved: true
tags: [web, three-tier, terraform, approved]
required_tags: [environment, owner, cost_center]
default_tags:
  environment: production
  owner: platform
  cost_center: shared
naming:
  component_id_prefix: aws_web
terraform:
  source: registry.terraform.io/cloudwright/aws-three-tier-web/aws
  version: 1.0.0
fragment:
  name: AWS Three-Tier Web Module
  provider: aws
  region: us-east-1
  components:
    - id: cdn
      service: cloudfront
      provider: aws
      label: CloudFront CDN
      description: Global content delivery and edge TLS termination.
      tier: 0
      config:
        estimated_gb: 500
    - id: lb
      service: alb
      provider: aws
      label: Application Load Balancer
      description: Public HTTP ingress with path routing.
      tier: 1
      config:
        lcu_per_hour: 1.0
    - id: app
      service: ec2
      provider: aws
      label: Auto-Scaled Web Tier
      description: Compute fleet for application workloads.
      tier: 2
      config:
        instance_type: t3.medium
        count: 2
    - id: db
      service: rds
      provider: aws
      label: PostgreSQL Database
      description: Managed relational database for application state.
      tier: 3
      config:
        engine: postgres
        instance_class: db.r5.large
        multi_az: true
  connections:
    - source: cdn
      target: lb
      label: HTTPS
      protocol: HTTPS
      port: 443
    - source: lb
      target: app
      label: HTTP
      protocol: HTTP
      port: 80
    - source: app
      target: db
      label: SQL
      protocol: TCP
      port: 5432
